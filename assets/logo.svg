<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Hasdemir Studio: "has demir". Çelik iki ayak, ortada dövülmüş demir gibi parlayan kor çizgi. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232733"/>
      <stop offset="1" stop-color="#121419"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f3f7"/>
      <stop offset="0.45" stop-color="#b9bfcc"/>
      <stop offset="1" stop-color="#727a8c"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb04a"/>
      <stop offset="0.5" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#e2541f"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- kor çizgi: ayakların arkasından geçer -->
  <rect x="150" y="236" width="212" height="40" rx="10" fill="url(#ember)"/>
  <rect x="170" y="247" width="172" height="5" rx="2.5" fill="#ffe0a8" opacity="0.85"/>
  <!-- çelik ayaklar: dış üst köşeleri dövülmüş gibi pahlı -->
  <path d="M140 112 H162 Q176 112 176 126 V386 Q176 400 162 400 H130 Q116 400 116 386 V136 Z" fill="url(#steel)"/>
  <path d="M372 112 H350 Q336 112 336 126 V386 Q336 400 350 400 H382 Q396 400 396 386 V136 Z" fill="url(#steel)"/>
</svg>
